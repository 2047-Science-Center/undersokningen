# Mosquitto-broker för Undersökningen (prototyp).
#
# Två listeners:
#   1883 = rå MQTT (TCP) — ESP32/scanner publicerar hit (PubSubClient).
#   9001 = MQTT över WebSocket — webbläsaren (appen) prenumererar hit.
#
# Portarna är valda för att INTE krocka med husets övriga tjänster
# (vite 5173+, WS-relä 8787, kombinerad host 8080).
#
# Prototyp på LAN: anonym åtkomst tillåten. Lås ned (lösenord/TLS) i skarp drift.
#
# Kör:  mosquitto -c deploy/broker/mosquitto.conf -v

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
