      .lbl { position: absolute; left: 120px; top: 52px; font-family: "IBM Plex Mono", monospace; font-weight: 700;

      .rub b { color: #ff9500; }

      .led { position: absolute; top: 732px; width: 800px; height: 14px; border-radius: 7px; background: #ff9500; opacity: 0.55; }

      .bord { position: absolute; left: 0; top: 0; width: 1400px; height: 724px; background-color: #2b1d12;

      .rem .tv { border: 2px solid #b8690f; border-radius: 8px; padding: 2px 14px; color: #ff9500; }

      /* föremål */
      .pol { position: absolute; background: #f3eee2; padding: 12px 12px 48px; box-shadow: 0 10px 22px rgba(0,0,0,0.55); }
      .pol img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #111; }
      .pol .cap { position: absolute; left: 14px; right: 14px; bottom: 8px; font-family: "IBM Plex Mono", monospace;

      .stamp.gra { border-color: #6f6a60; color: #6f6a60; }
      .flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; }
